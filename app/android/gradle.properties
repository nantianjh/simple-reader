# ─────────────────────────────────────────────────────────────────────────────
# Gradle 配置（Android 构建）
#
# 本机为 16GB 内存 + 第三方安全软件常驻，因此收紧并发与内存占用：
#   - 8G 堆 + 4G Metaspace 在 16GB 机器上过于激进，容易触发换页；
#   - 并行构建 / 文件系统监听 / 配置缓存会显著增加并发文件锁操作，
#     一旦安全软件介入新建 .lock 文件，就会出现
#     "FileNotFoundException ... .lock (拒绝访问)" 这类假故障。
# 串行化换来的是稳定性，代价是构建慢一些——首次构建本来就慢。
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

org.gradle.daemon=true
org.gradle.parallel=false
# 注意：不要设 org.gradle.workers.max=1。
# Flutter 通过 includeBuild 引入自己的 Gradle 插件（:gradle），配置该包含构建
# 需要向 worker 池派发任务；把池限制为 1 会造成等待超时
# （实测报 "A problem occurred configuring project ':gradle' > TimeoutException"）。
org.gradle.caching=true
org.gradle.configuration-cache=false
# 关闭文件系统监听：它会常驻监控构建目录，是与安全软件冲突最明显的一项。
org.gradle.vfs.watch=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
